name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Verify tag matches plugin version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          plugin_version="$(sed -n 's/^[[:space:]*]*Version:[[:space:]]*//p' wp-course-listings.php | head -n 1 | tr -d '\r')"
          if [ "$tag_version" != "$plugin_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin version $plugin_version"
            exit 1
          fi

      - name: Build plugin zip
        run: git archive --format=zip --prefix=wp-course-listings/ -o wp-course-listings.zip HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" wp-course-listings.zip \
            --title "WP Course Listings $GITHUB_REF_NAME" \
            --generate-notes
