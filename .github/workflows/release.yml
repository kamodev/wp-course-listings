name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Verify tag matches plugin version
        run: bin/check-version.sh "${GITHUB_REF_NAME#v}"

      - name: Build plugin zip
        run: make dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" wp-course-listings.zip \
            --title "WP Course Listings $GITHUB_REF_NAME" \
            --generate-notes
