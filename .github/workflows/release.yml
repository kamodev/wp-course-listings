name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to release. The tag is v<plugin version>.
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Determine release tag
        id: release
        run: |
          version="$(sed -n 's/^[[:space:]*]*Version:[[:space:]]*//p' wp-course-listings.php | head -n 1 | tr -d '\r')"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin version $version"
            exit 1
          fi
          # Older commits predate the version check script.
          if [ -x bin/check-version.sh ]; then
            bin/check-version.sh "$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build plugin zip
        run: git archive --format=zip --prefix=wp-course-listings/ -o wp-course-listings.zip HEAD

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" wp-course-listings.zip \
            --target "$(git rev-parse HEAD)" \
            --title "WP Course Listings $TAG" \
            --generate-notes
